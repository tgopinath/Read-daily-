<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f4e45" />
  <title>Read Daily</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="icon.svg" alt="" width="28" height="28" />
      <span>Read Daily</span>
    </div>
    <div class="date" id="today-date"></div>
  </header>

  <main>
    <!-- TODAY -->
    <section id="view-today" class="view active" aria-label="Today">
      <div class="card reading-card" id="today-reading"></div>

      <div class="section-head">
        <h2>Headlines</h2>
        <label class="region">
          <span class="sr-only">Region</span>
          <select id="region-select"></select>
        </label>
      </div>
      <p class="muted small" id="news-sources"></p>
      <ul class="news" id="news-list"></ul>
    </section>

    <!-- BOOKS -->
    <section id="view-books" class="view" aria-label="My books">
      <div class="card">
        <h2>Add a book</h2>
        <form id="add-form" autocomplete="off">
          <div class="field">
            <label for="book-title">Book title</label>
            <input id="book-title" required placeholder="e.g. Atomic Habits" />
            <ul class="suggestions" id="suggestions" hidden></ul>
          </div>
          <div class="field">
            <label for="book-author">Author <span class="muted">(optional)</span></label>
            <input id="book-author" placeholder="e.g. James Clear" />
          </div>
          <button class="btn primary" type="submit" id="add-btn">Add to my books</button>
          <p class="form-msg" id="add-msg" role="status"></p>
        </form>
      </div>

      <h2 class="list-title">My books</h2>
      <ul class="books" id="book-list"></ul>
    </section>

    <!-- READER -->
    <section id="view-reader" class="view" aria-label="Reader">
      <button class="btn link" id="reader-back">← Back</button>
      <article id="reader"></article>
    </section>
  </main>

  <nav class="tabs" aria-label="Main">
    <button data-view="today" class="active">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM8 9h8M8 13h8M8 17h5"/></svg>
      Today
    </button>
    <button data-view="books">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h10"/></svg>
      My books
    </button>
  </nav>

  <script type="module" src="app.js"></script>
</body>
</html>
